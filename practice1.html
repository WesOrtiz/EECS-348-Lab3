
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practice 1: My Profile</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }
        .profile-card {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
        }
        /* 1. CSS Styling for your Photo */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%; /* Makes the picture a perfect circle */
            object-fit: cover;
            border: 4px solid #0051ba; /* KU Blue border outline */
            margin-bottom: 15px;
        }
        h1 {
            margin: 10px 0 5px 0;
            color: #002244;
        }
        .bio-text {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin: 15px 0;
        }
        /* 2. CSS Styling for your Hyperlink */
        .profile-link {
            display: inline-block;
            margin: 15px 0;
            padding: 10px 20px;
            background-color: #0051ba;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .profile-link:hover {
            background-color: #002244;
        }
        /* 3. CSS Styling for your Video Container */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Creates a perfect 16:9 widescreen box */
            height: 0;
            overflow: hidden;
            margin-top: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Element 1: Your Photo -->
        <!-- Replace "my-photo.jpg" with your actual image file name -->
        <img src="images.jpeg" alt="Profile Picture" class="profile-img">

        <h1>Jayhawk Student</h1>
        <p style="color: #0051ba; font-weight: bold; margin: 0;">EECS Student</p>

        <p class="bio-text">
            Hi. Welcome to my practice profile page. I thought this image and video were quite comedic. 
        </p>

        <div class="video-container">
            <iframe 
                width="560" 
                height="315" 
                src="https://www.youtube.com/embed/Vz4IdAJ7TQc?si=I_rpzy9MX1kBthTj" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
