
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset=""UTF-8">
    <title>JS Password Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            max-width: 400px;
            margin: 0 auto;

        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;

        }
        input[type="password"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;

        }
        button:hover {
            background-color: #002244;

        }
    </style>
</head>
<body>
    
    <h2>Password Verification</h2>

    <!-- Form Inputs with Unique IDs -->
    <div class="form-group">
        <label for="password-first">Enter Password:</label>
        <input type="password" id="password-first">
    </div>

    <div class="form-group">
        <label for="password-second">Verify Password:</label>
        <input type="password" id="password-second">
    </div>

    <!-- Button triggering the validation function -->
    <button onclick="validatePasswords()">Validate</button>

    <script>
        function validatePasswords() {
            const firstInput = document.getElementById('password-first');
            const secondInput = document.getElementById('password-second');

            const pass1 = firstInput.value;
            const pass2 = secondInput.value;

            if (pass1.length < 8 || pass2.length < 8) {
                alert("Error: Passwords must be at least 8 characters long!");
            } 
            else if (pass1 !== pass2) {
                alert("Error: The passwords do not match!");
            } 
            else {
                alert("Success: The two passwords matched perfectly!");
            }
        }
    </script>

</body>
</html>
